name: Build KMTH APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Configure Gradle
        run: |
          echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g" > gradle.properties
          echo "org.gradle.daemon=true" >> gradle.properties
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties

      - name: Download libXray
        run: |
          mkdir -p app/libs

          curl -L -o libxray-android.zip \
            https://github.com/XTLS/libXray/releases/download/v26.9.9/libxray-android.zip

          unzip -o libxray-android.zip -d libxray

          cp libxray/libxray-android/libXray.aar \
            app/libs/libXray.aar

      - name: Verify libXray
        run: |
          echo "========================================"
          echo "Checking libXray.aar"
          echo "========================================"

          ls -lh app/libs/libXray.aar

          test -f app/libs/libXray.aar

          echo "libXray.aar OK"

      - name: Inspect libXray API
        run: |
          echo "========================================"
          echo "Inspecting libXray API"
          echo "========================================"

          echo "--- AAR files ---"
          unzip -l app/libs/libXray.aar

          echo ""
          echo "--- Controller / LibXray classes ---"
          unzip -l app/libs/libXray.aar | \
            grep -Ei 'DialerController|ListenerController|LibXray' || true

          echo ""
          echo "--- AAR structure ---"
          unzip -l app/libs/libXray.aar | \
            grep -Ei '\.jar$|classes\.jar|jni|\.so$' || true

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KMTH-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
