# KMTH VPN - GitHub Actions CI/CD Workflow
name: Build KMTH VPN Release

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build Xray Core Native & Package KMTH VPN APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Go Environment
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install Gomobile Tools
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          gomobile init

      - name: Clone Xray-core Source Code
        run: |
          git clone --depth 1 https://github.com/XTLS/Xray-core.git xray-core

      - name: Compile Native Android Libraries via Gomobile
        run: |
          mkdir -p app/src/main/jniLibs
          cd xray-core
          go get -tool golang.org/x/mobile/cmd/gobind || true
          go get golang.org/x/mobile@latest
          gomobile bind -v -target=android -androidapi 21 -o ../libv2ray.aar ./main
          cd ..
          mkdir -p app/libs
          cp libv2ray.aar app/libs/ || true
          unzip -o libv2ray.aar "jni/*" -d app/src/main/ || true
          if [ -d "app/src/main/jni" ]; then
            mv app/src/main/jni/* app/src/main/jniLibs/ || true
            rm -rf app/src/main/jni
          fi

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x gradlew || true

      - name: Build Release APK with Gradle
        run: gradle assembleRelease --no-daemon

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kmth-vpn-v2ray-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
